[project]
name = "ptcg-ai-battle-agent"
version = "0.1.0"
description = "Pokémon TCG AI Battle Challenge agent repository"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests", "ml/tests"]
python_files = ["test_*.py"]
addopts = "-q"
markers = [
    "smoke: end-to-end checks that load real agents and the cg engine (slower). Deselect with -m 'not smoke'.",
]
